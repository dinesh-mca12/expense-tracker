{% extends "base.html" %}

{% block title %}Add Expense | Expense Tracker{% endblock %}

{% block content %}
  <section class="hero compact-hero">
    <div>
      <p class="eyebrow">New expense</p>
      <h1>Add Expense</h1>
      <p class="intro">Record the title, amount, date, and category for a spending entry.</p>
    </div>
  </section>

  <section class="panel form-panel">
    <form action="{{ url_for('add_expense') }}" method="post">
      <div class="form-grid">
        <label>
          <span>Expense Title</span>
          <input
            type="text"
            name="title"
            value="{{ form_data.title }}"
            placeholder="Groceries"
            maxlength="120"
            required
          >
        </label>

        <label>
          <span>Amount</span>
          <input
            type="number"
            name="amount"
            value="{{ form_data.amount }}"
            min="0.01"
            step="0.01"
            placeholder="499.00"
            required
          >
        </label>

        <label>
          <span>Date</span>
          <input
            type="date"
            name="expense_date"
            value="{{ form_data.expense_date }}"
            required
          >
        </label>

        <label>
          <span>Category</span>
          <select name="category" required>
            {% for category in categories %}
              <option value="{{ category }}" {% if form_data.category == category %}selected{% endif %}>
                {{ category }}
              </option>
            {% endfor %}
          </select>
        </label>
      </div>

      <div class="form-actions">
        <a class="secondary-link" href="{{ url_for('index') }}">Cancel</a>
        <button type="submit">Save Expense</button>
      </div>
    </form>
  </section>
{% endblock %}
